name: B2B_Price_Auto_Collect

on:
  schedule:
    - cron: '0 21 * * *' # 매일 한국시간 오전 6시 실행 (UTC 21:00)
  workflow_dispatch: # 수동 실행 버튼 활성화

# 로봇에게 파일 쓰기 권한을 명시적으로 부여합니다 (오류 128 해결 핵심)
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager pandas openpyxl

      - name: Run Collector
        # -u 옵션을 사용하여 로봇이 일하는 과정을 실시간으로 중계합니다.
        run: python -u run_quick_with_upload.py

      - name: Commit and Push results
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@autoscrape.com"
          git add .
          git commit -m "Auto Update Prices: $(date)" || exit 0
          git push
