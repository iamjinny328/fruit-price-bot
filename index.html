<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B 과일 가격 실시간 대시보드</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; font-family: 'Pretendard', sans-serif; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 1400px; }
        .header-title { color: #2c3e50; margin-bottom: 25px; border-left: 5px solid #27ae60; padding-left: 15px; font-weight: 800; }
        .filter-row { margin-bottom: 20px; background: #f1f3f5; padding: 20px; border-radius: 12px; }
        .table-responsive { max-height: 750px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 8px; }
        .price-up { color: #e74c3c; font-weight: 800; font-size: 1.15rem; }
        .badge-site { background-color: #3498db; font-size: 0.85rem; padding: 6px 10px; }
        .badge-kw { background-color: #f39c12; font-size: 0.85rem; padding: 6px 10px; }
        th { position: sticky; top: 0; background: #212529 !important; color: white; z-index: 10; text-align: center; }
        td { border-bottom: 1px solid #eee; }
        .product-info { max-width: 400px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header-title">🍎 B2B 실시간 가격 비교 대시보드</h2>
    
    <!-- 필터 및 검색 영역 -->
    <div class="row filter-row g-3">
        <div class="col-md-4">
            <label class="form-label fw-bold">🔍 상품 검색</label>
            <input type="text" id="searchInput" class="form-control" placeholder="상품명 또는 옵션을 입력하세요">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold">🏢 업체 선택</label>
            <select id="siteFilter" class="form-select">
                <option value="">모든 업체 보기</option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold">🍇 품목 선택</label>
            <select id="keywordFilter" class="form-select">
                <option value="">모든 품목 보기</option>
            </select>
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button onclick="loadData()" class="btn btn-success w-100 fw-bold">🔄 새로고침</button>
        </div>
    </div>

    <div id="status" class="alert alert-info py-2 d-flex justify-content-between align-items-center mb-3">
        <span id="loadTime">데이터 로딩 중...</span>
        <span id="countSummary" class="badge bg-dark"></span>
    </div>
    
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th style="width: 140px;">사이트</th>
                    <th style="width: 100px;">키워드</th>
                    <th>상품명 / 옵션 상세</th>
                    <th class="text-end" style="width: 130px;">공급가</th>
                    <th style="width: 120px;">배송비</th>
                    <th style="width: 160px;">수집시간</th>
                    <th style="width: 80px;">링크</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 로봇이 수집한 데이터가 여기에 나타납니다 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let allData = [];

    async function loadData() {
        const url = '가격이력.xlsx?v=' + new Date().getTime(); 
        const loadTime = document.getElementById('loadTime');
        const countSummary = document.getElementById('countSummary');
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('가격 데이터 파일이 아직 없습니다. 수집을 먼저 실행해 주세요.');
            
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, {type: 'array'});
            
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            allData = XLSX.utils.sheet_to_json(firstSheet);
            
            // 데이터 수집 시간 역순 정렬 (최신이 위로)
            allData.sort((a, b) => new Date(b['수집날짜']) - new Date(a['수집날짜']));

            initFilters(allData);
            applyFilters();
            
            loadTime.innerText = `마지막 수집 완료: ${allData[0]?.['수집날짜'] || '-'}`;
        } catch (error) {
            loadTime.innerText = '오류: ' + error.message;
        }
    }

    function initFilters(data) {
        const sites = [...new Set(data.map(item => item['사이트명']).filter(x => x))].sort();
        const keywords = [...new Set(data.map(item => item['키워드']).filter(x => x))].sort();

        const siteSelect = document.getElementById('siteFilter');
        const kwSelect = document.getElementById('keywordFilter');

        siteSelect.innerHTML = '<option value="">모든 업체 보기</option>';
        kwSelect.innerHTML = '<option value="">모든 품목 보기</option>';

        sites.forEach(site => siteSelect.innerHTML += `<option value="${site}">${site}</option>`);
        keywords.forEach(kw => kwSelect.innerHTML += `<option value="${kw}">${kw}</option>`);
    }

    function applyFilters() {
        const searchValue = document.getElementById('searchInput').value.toLowerCase();
        const siteValue = document.getElementById('siteFilter').value;
        const kwValue = document.getElementById('keywordFilter').value;
        
        const filtered = allData.filter(item => {
            const text = (String(item['상품명'] || '') + String(item['옵션명'] || '') + String(item['사이트명'] || '')).toLowerCase();
            const matchSearch = text.includes(searchValue);
            const matchSite = siteValue === "" || item['사이트명'] === siteValue;
            const matchKw = kwValue === "" || item['키워드'] === kwValue;
            return matchSearch && matchSite && matchKw;
        });

        document.getElementById('countSummary').innerText = `검색 결과: ${filtered.length}건 / 전체: ${allData.length}건`;
        renderTable(filtered);
    }

    function renderTable(data) {
        const tableBody = document.getElementById('tableBody');
        
        if (data.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" class="text-center p-5 text-muted">일치하는 상품이 없습니다.</td></tr>';
            return;
        }

        let html = "";
        data.forEach(item => {
            html += `
                <tr>
                    <td class="text-center"><span class="badge badge-site">${item['사이트명'] || '-'}</span></td>
                    <td class="text-center"><span class="badge badge-kw">${item['키워드'] || '-'}</span></td>
                    <td class="product-info">
                        <div class="fw-bold text-dark text-truncate">${item['상품명'] || '-'}</div>
                        <div class="text-muted small">${item['옵션명'] || '-'}</div>
                    </td>
                    <td class="text-end price-up">${Number(String(item['공급가'] || 0).replace(/[^0-9]/g, '')).toLocaleString()}원</td>
                    <td class="text-center small">${item['배송비'] || '-'}</td>
                    <td class="text-center"><div class="small text-muted">${item['수집날짜'] || '-'}</div></td>
                    <td class="text-center"><a href="${item['상세URL']}" target="_blank" class="btn btn-sm btn-outline-primary">링크</a></td>
                </tr>
            `;
        });
        tableBody.innerHTML = html;
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('siteFilter').addEventListener('change', applyFilters);
    document.getElementById('keywordFilter').addEventListener('change', applyFilters);

    window.onload = loadData;
</script>

</body>
</html>
