<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2B 과일 가격 실시간 대시보드</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-title { color: #2c3e50; margin-bottom: 25px; border-left: 5px solid #27ae60; padding-left: 15px; }
        .search-box { margin-bottom: 20px; }
        .table-responsive { max-height: 700px; overflow-y: auto; }
        .price-up { color: #e74c3c; font-weight: bold; }
        .badge-site { background-color: #3498db; }
        .badge-kw { background-color: #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="header-title">🍎 B2B 실시간 가격 비교 대시보드</h2>
    
    <div class="row search-box">
        <div class="col-md-8">
            <input type="text" id="searchInput" class="form-control" placeholder="상품명 또는 업체명을 입력하세요 (예: 사과, 웰그린)">
        </div>
        <div class="col-md-4">
            <button onclick="loadData()" class="btn btn-success w-100">🔄 데이터 새로고침</button>
        </div>
    </div>

    <div id="status" class="text-muted mb-2">데이터를 불러오는 중...</div>
    
    <div class="table-responsive">
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>사이트</th>
                    <th>키워드</th>
                    <th>상품명 / 옵션</th>
                    <th>공급가</th>
                    <th>배송비</th>
                    <th>수집시간</th>
                    <th>링크</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    async function loadData() {
        const url = '가격이력.xlsx?v=' + new Date().getTime(); // 캐시 방지
        const status = document.getElementById('status');
        
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error('파일을 찾을 수 없습니다. 수집이 완료되었는지 확인하세요.');
            
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, {type: 'array'});
            
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);
            
            displayData(jsonData);
            status.innerText = `총 ${jsonData.length}개의 데이터가 수집되었습니다.`;
        } catch (error) {
            status.innerText = '오류: ' + error.message;
        }
    }

    function displayData(data) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        data.forEach(item => {
            const row = `
                <tr>
                    <td><span class="badge badge-site">${item['사이트명'] || '-'}</span></td>
                    <td><span class="badge badge-kw">${item['키워드'] || '-'}</span></td>
                    <td>
                        <strong>${item['상품명'] || '-'}</strong><br>
                        <small class="text-muted">${item['옵션명'] || '-'}</small>
                    </td>
                    <td class="price-up">${item['공급가'] || '0'}</td>
                    <td>${item['배송비'] || '-'}</td>
                    <td><small>${item['수집날짜'] || '-'}</small></td>
                    <td><a href="${item['상세URL']}" target="_blank" class="btn btn-sm btn-outline-primary">보기</a></td>
                </tr>
            `;
            tableBody.innerHTML += row;
        });
    }

    // 실시간 검색 기능
    document.getElementById('searchInput').addEventListener('keyup', function() {
        const value = this.value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');
        
        rows.forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(value) ? '' : 'none';
        });
    });

    window.onload = loadData;
</script>

</body>
</html>
